name: Nightly

# Behavior over many seeded scenarios and days of simulated time, and the coverage of the
# other tests: too long for every push.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulated:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-packages
      - run: uv run pytest -m nightly --durations=20

  # Every test but the simulated runs, with what each file misses; fails below the floors.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-packages
      - run: uv run pytest --cov --cov-report=term
      - name: The write path's coverage
        run: >-
          uv run coverage report --fail-under=94
          --include=src/thermaestro/nibe/transport/tgw.py,src/thermaestro/core/executor.py,src/thermaestro/nibe/plugin.py,src/thermaestro/nibe/rig/checks.py
