name: CI

# Not for a change to the docs or the website alone: the sign-off check runs for those
# (signoff.yml), and the website deploys itself (pages.yml). docs/docker.md counts as
# code: its backup and move are run here.
on:
  push:
    paths:
      - "**"
      - "!docs/**"
      - "docs/docker.md"
      - "!site/**"
      - "!*.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "docs/docker.md"
      - "!site/**"
      - "!*.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Lockfile is current
        run: uv lock --check
      - run: uv sync --locked --all-packages
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - name: Test vectors match their generator
        run: uv run python scripts/make-testvectors.py --check
      - run: uv run pytest

  image:
    runs-on: ubuntu-24.04
    env:
      THERMAESTRO_SOURCE: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start it as compose.yaml does, from this commit
        run: docker compose up --detach --build --wait --wait-timeout 180
      - name: It answers, as its own user, and offers a setup code
        run: |
          curl -fsS http://127.0.0.1:8080/health
          curl -kfsS https://127.0.0.1:8443/health
          test "$(docker compose exec -T thermaestro id -u)" = 10001
          docker compose logs thermaestro | grep -q "No administrator yet"
      - name: The backup in docs/docker.md works
        run: |
          docker compose stop
          docker compose cp thermaestro:/data ./backup
          test -s backup/thermaestro.db
      - name: The move in docs/docker.md works
        run: |
          (umask 077; tar -C backup -czf state.tar.gz .)
          docker compose down --volumes
          docker compose run --rm -T --no-deps --entrypoint tar thermaestro -xzpf - -C /data < state.tar.gz
          docker compose up --detach --wait --wait-timeout 180
          test "$(docker compose exec -T thermaestro stat -c %u /data/thermaestro.db)" = 10001
      - name: It builds from GitHub, as compose.yaml does by default
        run: |
          export THERMAESTRO_SOURCE="https://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          docker compose build
      - name: Its log
        if: always()
        run: docker compose logs

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --no-dev --all-packages
      - run: scripts/check-licenses.sh
