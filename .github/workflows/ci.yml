name: CI

# Not for a change to the docs or the website alone: the sign-off check runs for those
# (signoff.yml), and the website deploys itself (pages.yml). docs/docker.md counts as
# code: its backup and move are run here.
on:
  push:
    paths:
      - "**"
      - "!docs/**"
      - "docs/docker.md"
      - "!site/**"
      - "!*.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "docs/docker.md"
      - "!site/**"
      - "!*.md"

permissions:
  contents: read

jobs:
  # A branch goes into main by fast-forward, so a push to main is usually a commit CI has
  # already passed on its branch: that isn't run again. Anything else runs in full.
  tested:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.passed.outputs.run }}
    steps:
      - id: passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" = main ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" \
              --jq '[.workflow_runs[] | select(.head_branch != "main")] | length')
            if [ "$passed" -gt 0 ]; then
              echo "CI already passed on this commit on its branch"
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  check:
    needs: tested
    if: needs.tested.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Lockfile is current
        run: uv lock --check
      - run: uv sync --locked --all-packages
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - name: Test vectors match their generator
        run: uv run python scripts/make-testvectors.py --check
      # Coverage, which doubles the time, is measured each night (nightly.yml). A worker
      # per core; the slowest tests named, as candidates for the nightly run.
      - run: uv run pytest -n auto --durations=25

  image:
    needs: tested
    if: needs.tested.outputs.run == 'true'
    runs-on: ubuntu-24.04
    env:
      THERMAESTRO_SOURCE: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start it as compose.yaml does, from this commit
        run: docker compose up --detach --build --wait --wait-timeout 180
      - name: It answers, as its own user, and offers a setup code
        run: |
          curl -fsS http://127.0.0.1:8080/health
          curl -kfsS https://127.0.0.1:8443/health
          test "$(docker compose exec -T thermaestro id -u)" = 10001
          docker compose logs thermaestro | grep -q "No administrator yet"
      - name: The backup in docs/docker.md works
        run: |
          docker compose stop
          docker compose cp thermaestro:/data ./backup
          test -s backup/thermaestro.db
      - name: The move in docs/docker.md works
        run: |
          (umask 077; tar -C backup -czf state.tar.gz .)
          docker compose down --volumes
          docker compose run --rm -T --no-deps --entrypoint tar thermaestro -xzpf - -C /data < state.tar.gz
          docker compose up --detach --wait --wait-timeout 180
          test "$(docker compose exec -T thermaestro stat -c %u /data/thermaestro.db)" = 10001
      - name: It builds from GitHub, as compose.yaml does by default
        run: |
          export THERMAESTRO_SOURCE="https://github.com/${GITHUB_REPOSITORY}.git#${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          docker compose build
      - name: Its log
        if: always()
        run: docker compose logs

  licenses:
    needs: tested
    if: needs.tested.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --no-dev --all-packages
      - run: scripts/check-licenses.sh
