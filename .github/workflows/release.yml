name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Check that the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for package in thermaestro thermaestro-gateway; do
            version="$(uv version --package "$package" --short)"
            if [ "$version" != "$tag" ]; then
              echo "$package is $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: uv build --package thermaestro --out-dir dist/thermaestro
      - run: uv build --package thermaestro-gateway --out-dir dist/thermaestro-gateway
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thermaestro
          path: dist/thermaestro/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thermaestro-gateway
          path: dist/thermaestro-gateway/

  # One job and one environment per PyPI project: PyPI's trusted publishing
  # accepts each repository/workflow/environment combination for one project only.
  publish-thermaestro:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thermaestro
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-thermaestro-gateway:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi-gateway
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: thermaestro-gateway
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
