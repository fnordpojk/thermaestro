name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Check that the tag matches both package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for package in thermaestro thermaestro-gateway; do
            version="$(uv version --package "$package" --short)"
            if [ "$version" != "$tag" ]; then
              echo "$package is $version, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: uv build --package thermaestro --out-dir dist/thermaestro
      - run: uv build --package thermaestro-gateway --out-dir dist/thermaestro-gateway
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thermaestro
          path: dist/thermaestro/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thermaestro-gateway
          path: dist/thermaestro-gateway/

  # One job and one environment per PyPI project: PyPI's trusted publishing
  # accepts each repository/workflow/environment combination for one project only.
  publish-thermaestro:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thermaestro
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  publish-thermaestro-gateway:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi-gateway
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thermaestro-gateway
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
