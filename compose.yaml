# Thermaestro with Docker Compose. `docker compose up -d` builds the image from GitHub
# and starts it; `docker compose up -d --build` updates it. docs/docker.md says more.
name: thermaestro

services:
  thermaestro:
    build:
      # GitHub's main branch, a branch (…/thermaestro.git#<branch>), or a local clone (.)
      context: ${THERMAESTRO_SOURCE:-https://github.com/fnordpojk/thermaestro.git#main}
    image: thermaestro:local
    hostname: thermaestro # the name in its own HTTPS certificate
    restart: unless-stopped
    ports:
      - "${THERMAESTRO_HTTP_PORT:-8080}:8080"
      - "${THERMAESTRO_HTTPS_PORT:-8443}:8443"
      # A gateway that sends to a fixed address and port, such as openHAB's NibeGW,
      # needs that port here and as the local port under Setup → Pump. esphome-nibe
      # and the Thermaestro gateway answer where Thermaestro sends from, and need none.
      # - "9999:9999/udp"
    volumes:
      - ./config:/config:ro # the start-up file thermaestro.toml, if any
      - data:/data # the database, the secrets, the certificate and the audit log
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local # kept to 100 MB

volumes:
  data:
