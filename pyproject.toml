[project]
name = "thermaestro"
version = "0.0.0"
description = "Heat-pump controller (placeholder release, not usable yet)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The plugin messages, and the JSON Schema generated from them.
    "pydantic>=2,<3",
    # The frame and protocol codec. Pinned to this release: both sides of the
    # protocol registry must match.
    "thermaestro-gateway==0.0.0",
    # The web UI and API. FastAPI is still 0.x and changes often, so upgrades are
    # taken one minor version at a time.
    "fastapi>=0.142.2,<0.143",
    "uvicorn>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "babel>=2.18.0",
    # Password hashing, and the certificate a new installation makes for HTTPS.
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "aiomqtt>=2",
    "aiohttp>=3.12",
    "pymodbus>=3.15,<3.16",
    "holidays>=0.106",
]

[project.scripts]
thermaestro = "thermaestro.cli:main"

[project.entry-points."thermaestro.plugins"]
energy_charts = "thermaestro.energy_charts.plugin:create"
entsoe = "thermaestro.entsoe.plugin:create"
homeassistant = "thermaestro.homeassistant.plugin:create"
met_norway = "thermaestro.met_norway.plugin:create"
nibe = "thermaestro.nibe.plugin:create"
nordic_sites = "thermaestro.nordic_sites.plugin:create"
octopus_agile = "thermaestro.octopus_agile.plugin:create"
omie = "thermaestro.omie.plugin:create"
open_meteo = "thermaestro.open_meteo.plugin:create"
smhi = "thermaestro.smhi.plugin:create"
tibber = "thermaestro.tibber.plugin:create"

[project.urls]
Repository = "https://github.com/fnordpojk/thermaestro"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["gateway"]

[tool.uv.sources]
thermaestro-gateway = { workspace = true }

[dependency-groups]
dev = [
    "amqtt>=0.12.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyserial>=3.5.0.20260712",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff's own
    "ASYNC",        # blocking calls in async code
    "BLE",          # blind except
    "S",            # bandit
    "T20",          # stray print
    "PT",           # pytest style
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests check things; seeded random numbers make repeatable faults;
# tests look at small local files (a socket's mode, a connection file) directly, use
# invented passwords, and poll for what another task or process does, with a deadline.
"**/tests/**" = ["S101", "S311", "ASYNC240", "S105", "S106", "ASYNC109", "ASYNC110"]
# A timeout here is the wait for each answer: an act's fates come one at a time, each
# with its own wait, which a timeout around the whole call can't express.
"src/thermaestro/cap/client.py" = ["ASYNC109"]
# A request's timeout becomes its ttl at the gateway and a cancel when it runs out, so
# a write given up on never reaches the pump; cancelling the call from outside can't.
"src/thermaestro/nibe/transport/*" = ["ASYNC109"]
# The probe's read-only transport keeps the transport interface's signature, and waits
# for the plugin's values the way the tests do, with a deadline.
"src/thermaestro/nibe/probe.py" = ["ASYNC109", "ASYNC110"]
# "A byte within this time" is what the simulated pump waits for.
"gateway/tests/simpump.py" = ["ASYNC109"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
mypy_path = ["src", "gateway/src", "gateway/tests", "tests"]
files = ["src", "gateway/src", "tests", "gateway/tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "gateway/tests"]
pythonpath = ["gateway/tests", "tests"]
# Two test folders share module names, so tests aren't imported as packages.
addopts = ["--import-mode=importlib", "-m", "not nightly"]
markers = ["nightly: long simulated runs over many scenarios, run each night (pytest -m nightly)"]
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = ["error"]
