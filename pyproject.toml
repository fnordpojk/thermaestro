[project]
name = "thermaestro"
version = "0.0.0"
description = "Heat-pump controller (placeholder release, not usable yet)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The frame and protocol codec. Pinned to this release: both sides of the
    # protocol registry must match.
    "thermaestro-gateway==0.0.0",
]

[project.urls]
Repository = "https://github.com/fnordpojk/thermaestro"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["gateway"]

[tool.uv.sources]
thermaestro-gateway = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-pyserial>=3.5.0.20260712",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RUF",          # ruff's own
    "ASYNC",        # blocking calls in async code
    "BLE",          # blind except
    "S",            # bandit
    "T20",          # stray print
    "PT",           # pytest style
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest tests check things.
"**/tests/**" = ["S101"]
# A request's timeout becomes its ttl at the gateway and a cancel when it runs out, so
# a write given up on never reaches the pump; cancelling the call from outside can't.
"src/thermaestro/nibe/transport/*" = ["ASYNC109"]
# "A byte within this time" is what the simulated pump waits for.
"gateway/tests/simpump.py" = ["ASYNC109"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["src", "gateway/src", "gateway/tests"]
files = ["src", "gateway/src", "tests", "gateway/tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "gateway/tests"]
pythonpath = ["gateway/tests"]
# Two test folders share module names, so tests aren't imported as packages.
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = ["error"]
