{% extends "base.html" %}
{% block title %}{{ _("Log in") }}{% endblock %}
{% block main %}
<section class="narrow">
<h1>{{ _("Log in") }}</h1>
{% if not has_admin %}
<p class="notice">{{ _("No administrator exists yet.") }} <a href="/setup">{{ _("Create the first one with the setup code.") }}</a></p>
{% endif %}
<form method="post" action="/login">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>{{ _("User name") }}
    <input name="name" autocomplete="username" required autofocus value="{{ name | default('') }}"></label>
  <label>{{ _("Password") }}
    <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">{{ _("Log in") }}</button>
</form>
</section>
{% endblock %}
